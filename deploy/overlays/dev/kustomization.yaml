apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: web-dev
namePrefix: dev-

resources:
  - namespace.yaml
  - ../../base

images:
  - name: web  # CI sets newTag to the built sha
    newName: ghcr.io/etedgy/assignment-web
    newTag: dev

patches:
  - path: patch-config.yaml
  - path: patch-hpa.yaml
  - path: patch-ingress.yaml
