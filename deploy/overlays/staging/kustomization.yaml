apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: web-staging
namePrefix: staging-

resources:
  - namespace.yaml
  - ../../base

images:
  - name: web
    newName: ghcr.io/etedgy/assignment-web
    newTag: staging

patches:
  - path: patch-config.yaml
  - path: patch-hpa.yaml
  - path: patch-ingress.yaml
