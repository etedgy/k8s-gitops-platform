apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Environment-agnostic app definition; overlays layer env-specific config.
labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

resources:
  - serviceaccount.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
