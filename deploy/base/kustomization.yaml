apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Reusable, environment-agnostic definition of the app. Overlays layer on
# environment-specific names, replica counts, config and image tags.
labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

resources:
  - serviceaccount.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
