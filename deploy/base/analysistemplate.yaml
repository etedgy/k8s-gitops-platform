# Canary gate: abort the rollout if success rate drops below 95%.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: success-rate
spec:
  metrics:
    - name: success-rate
      initialDelay: 60s # let Prometheus accumulate samples before measuring
      interval: 30s
      count: 3
      successCondition: result[0] >= 0.95
      failureLimit: 2
      provider:
        prometheus:
          address: http://prometheus-server.monitoring.svc.cluster.local
          # `or on() vector(1)` => treat no-data (warm-up) as healthy, not an error
          query: |
            (
              sum(rate(app_requests_total{status!~"5.."}[2m]))
              /
              sum(rate(app_requests_total[2m]))
            ) or on() vector(1)
