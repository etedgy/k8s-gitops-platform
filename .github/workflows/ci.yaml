name: ci

on:
  push:
    branches: [main]
    paths: ["app/**", "deploy/**", ".github/workflows/ci.yaml"]
  pull_request:
    paths: ["app/**", "deploy/**", ".github/workflows/ci.yaml"]

permissions:
  contents: read
  packages: write
  id-token: write  # OIDC; no long-lived creds

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/assignment-web

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install deps
        working-directory: app
        run: pip install -r requirements.txt pytest
      - name: Unit tests
        working-directory: app
        run: pytest -q

  validate-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Build kustomize overlays
        run: |
          for env in dev staging prod; do
            echo "::group::kustomize build $env"
            kubectl kustomize deploy/overlays/$env
            echo "::endgroup::"
          done

  build-and-push:
    needs: [test, validate-manifests]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: app
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:edge
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: table
          exit-code: "0"  # report-only
          severity: CRITICAL,HIGH
