name: cd

# promote CI-built digest: main->dev, tag->staging->prod

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, staging, prod]
        required: true
      image_sha:
        description: Image SHA to deploy (defaults to current ref)
        required: false

permissions:
  contents: read
  id-token: write  # OIDC; no static kubeconfig

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/assignment-web

jobs:
  deploy-dev:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede  # v4
      - name: Authenticate to cluster
        run: |
          echo "Real cluster: kubeconfig via OIDC (aws eks update-kubeconfig / az aks get-credentials)."
      - name: Deploy to dev
        run: |
          cd deploy/overlays/dev
          kubectl kustomize . | sed "s#ghcr.io/OWNER/assignment-web:dev#${IMAGE}:${{ github.event.workflow_run.head_sha }}#" > /dev/null
          echo "kubectl apply -k deploy/overlays/dev (pinned to ${{ github.event.workflow_run.head_sha }})"
      - name: Wait for rollout
        run: echo "kubectl -n web-dev rollout status deploy/dev-web --timeout=120s"

  deploy-staging:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede  # v4
      - name: Deploy release ${{ github.ref_name }} to staging
        run: echo "Promote the CI-tested digest to staging, then rollout status + smoke tests."

  deploy-prod:
    needs: deploy-staging
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production  # approval gate
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede  # v4
      - name: Deploy release ${{ github.ref_name }} to prod
        run: echo "Same digest -> prod after approval; rollout status gates success, else rollout undo."
