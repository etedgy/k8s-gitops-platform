apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: web-staging
  namespace: argocd
spec:
  project: assignment
  source:
    repoURL: https://github.com/OWNER/eitan-interview.git
    targetRevision: main
    path: deploy/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: web-staging
  # no automated policy: staging promotion is a manual/approved sync
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
